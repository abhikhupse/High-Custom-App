<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tracking Report | High Custom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/master-clean-shell.css"><link rel="stylesheet" href="/css/master-tracking-report.css">
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"><div class="sidebar-brand"></div><ul class="nav-menu"></ul></aside>
  <nav class="top-navbar" id="topNavbar"><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button></nav>
  <main class="main-content" id="mainContent"><section id="masterTrackingReportPage" class="master-tracking-report master-clean-page">
    <div class="master-clean-hero"><div><h1 class="master-clean-title">Tracking Report</h1><p class="master-clean-subtitle">View engagement and delivery activity for your campaigns.</p></div><div class="admin-tracking-today"><i class="far fa-calendar-alt"></i><span>Today<small id="masterTrackingToday">—</small></span></div></div>
    <div class="tracking-filter-bar"><div class="tracking-filter-group"><input id="masterTrackingSearch" class="form-control" type="search" placeholder="Search lead name, email, subject..."></div><div class="tracking-filter-group"><select id="masterTrackingBusinessType" class="form-select"><option value="">All Business Types</option></select></div><div class="tracking-filter-group"><select id="masterTrackingStep" class="form-select"><option value="">All Steps</option></select></div><div class="tracking-filter-group"><select id="masterTrackingStatus" class="form-select"><option value="">All Status</option><option value="pending">Pending</option><option value="sent">Sent</option><option value="seen">Seen</option><option value="replied">Replied</option><option value="interested">Interested</option><option value="not interested">Not Interested</option><option value="failed">Failed</option></select></div><div class="tracking-filter-group"><select id="masterTrackingDateRange" class="form-select"><option value="">Select Date Range</option><option value="today">Today</option><option value="7days">Last 7 Days</option><option value="30days">Last 30 Days</option></select></div></div>
    <div class="tracking-report-card master-clean-card"><div class="tracking-table-toolbar"><label>Show <select id="masterTrackingPageSize"><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option></select> entries</label><div class="tracking-toolbar-actions"><button id="masterTrackingRefresh" type="button" title="Refresh"><i class="fas fa-rotate-right"></i></button><button id="masterTrackingExportCsv" type="button"><i class="fas fa-download me-2"></i>Export CSV</button><button class="tracking-export-excel" id="masterTrackingExportExcel" type="button"><i class="fas fa-file-excel me-2"></i>Export Excel</button></div></div><div class="tracking-table-wrap"><table id="masterTrackingTable" class="table tracking-all-table align-middle"><thead><tr><th>#</th><th>Lead Name</th><th>Lead Email</th><th>Business Type</th><th>Step</th><th>Subject</th><th>Scheduled At</th><th>Status</th><th>Sent At</th><th>Seen At</th><th>WhatsApp</th><th>Instagram</th><th>Facebook Messenger</th><th>Threads</th><th>Actions</th></tr></thead><tbody></tbody></table></div><div class="tracking-pagination" id="masterTrackingPagination" aria-live="polite"></div></div>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="/js/static-navigation.js"></script><script src="/js/master-tracking-report.js"></script>
</body>
</html>
